<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070d">
<title>Paw Pairs</title>
<meta name="description" content="Paw Pairs: a cute animal memory matching game. Flip the cards and find every pair!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    60/30/10 color rule
    60% — Dominant (blue-black): page background
    30% — Secondary (blue): cards, stat panels, buttons
    10% — Accent (white): headings, numbers, active button, matched-card outline
  */
  :root {
    color-scheme: dark; /* deliberately single dark theme */
    /* 60% Dominant */
    --bg-0: #05070d;
    --bg-1: #0a0f1c;
    --bg-2: #0f1628;
    /* 30% Secondary */
    --blue-1: #142a5c;
    --blue-2: #1e3f8a;
    --blue-3: #2f5fd0;
    --blue-glow: rgba(47, 95, 208, .35);
    /* 10% Accent */
    --white: #ffffff;
    --white-soft: rgba(255, 255, 255, .85);
    /* Neutral text */
    --text: #9fb0d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at top, #0d1730 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #08101f 0%, transparent 60%),
      var(--bg-0);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-block: max(20px, env(safe-area-inset-top, 0px)) 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  .paw-bg {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    font-size: 40px; overflow: hidden; contain: strict;
  }
  /* Silhouette via text-shadow (painted once) instead of a full-screen filter that repaints every frame */
  .paw-bg span {
    position: absolute; opacity: .07;
    color: transparent; text-shadow: 0 0 0 #c8d4f0;
    animation: floaty 9s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-10deg); } 50% { transform: translateY(-25px) rotate(10deg); } }

  main { position: relative; z-index: 1; width: 100%; max-width: 720px; text-align: center; }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 600;
    color: var(--white);
    text-shadow: 0 0 18px var(--blue-glow), 0 3px 0 var(--blue-2);
    letter-spacing: .5px;
    margin-bottom: 4px;
  }
  .subtitle { font-size: 16px; margin-bottom: 18px; }

  .levels { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .btn {
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    font-family: inherit; font-size: 16px; font-weight: 500;
    border: 1px solid var(--blue-2); border-radius: 999px; padding: 10px 20px; cursor: pointer;
    background: var(--blue-1); color: var(--text);
    box-shadow: 0 4px 0 #0a1838;
    transition: transform .15s, box-shadow .15s, background .2s, color .2s;
  }
  .btn:hover { transform: translateY(-2px); background: var(--blue-2); color: var(--white); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a1838; }
  .btn.active {
    background: var(--white); color: var(--bg-1); border-color: var(--white);
    box-shadow: 0 4px 0 #8fa3d1, 0 0 16px rgba(255,255,255,.25);
  }

  .stats {
    display: flex; gap: 10px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap;
  }
  .stat {
    background: linear-gradient(160deg, var(--blue-1), var(--bg-2));
    border: 1px solid rgba(47,95,208,.35);
    border-radius: 18px; padding: 8px 16px; min-width: 100px;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .stat small { display: block; font-size: 12px; color: var(--text); }
  .stat b { font-size: 20px; font-weight: 600; color: var(--white); }

  .board {
    display: grid; gap: 12px; margin: 0 auto;
    perspective: 1000px;
  }
  .card {
    aspect-ratio: 1; position: relative; cursor: pointer;
    touch-action: manipulation;              /* no double-tap zoom on iOS */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-transform-style: preserve-3d; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,1.6,.6,1);
    border-radius: 18px;
  }
  .card.flipped, .card.matched { transform: rotateY(180deg); }
  .card.matched { cursor: default; }
  .face {
    position: absolute; inset: 0; border-radius: 18px;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 0 rgba(0,0,0,.45), 0 8px 18px rgba(0,0,0,.35);
  }
  .back {
    background:
      radial-gradient(circle at 28% 25%, rgba(255,255,255,.18) 0 10%, transparent 11%),
      linear-gradient(145deg, var(--blue-3), var(--blue-1));
    font-size: clamp(22px, 5vw, 34px);
    border: 2px solid rgba(255,255,255,.15);
  }
  /* Hover: transform + border only (no box-shadow animation = no repaint) */
  @media (hover: hover) {
    .card:not(.flipped):not(.matched):hover { transform: translateY(-3px); }
    .card:not(.flipped):not(.matched):hover .back { border-color: rgba(255,255,255,.45); }
  }
  .front {
    background: linear-gradient(160deg, var(--bg-2), var(--blue-1));
    transform: rotateY(180deg);
    font-size: clamp(32px, 9vw, 58px);
    border: 2px solid var(--blue-3);
  }
  .card.matched .front {
    border-color: var(--white);
    box-shadow: 0 0 0 1px var(--white), 0 0 20px rgba(255,255,255,.3);
    animation: pop .5s ease;
  }
  .card.wrong { animation: shake .4s; }
  @keyframes pop { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.15); } 100% { transform: rotateY(180deg) scale(1); } }
  @keyframes shake { 0%,100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-6px); } 75% { transform: rotateY(180deg) translateX(6px); } }

  .toast {
    position: fixed; top: 22px; left: 50%; transform: translate(-50%, -120px);
    background: var(--white); color: var(--bg-1); padding: 10px 22px; border-radius: 999px; font-size: 18px;
    box-shadow: 0 6px 24px var(--blue-glow); transition: transform .35s cubic-bezier(.4,1.6,.6,1);
    z-index: 20; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }

  .controls { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }

  .overlay {
    position: fixed; inset: 0; background: rgba(3,5,10,.85);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: linear-gradient(170deg, var(--blue-1), var(--bg-1) 70%);
    border-radius: 28px; padding: 28px 30px; max-width: 360px; width: 100%;
    text-align: center; border: 1px solid var(--blue-3);
    box-shadow: 0 0 40px var(--blue-glow), 0 10px 40px rgba(0,0,0,.6);
    animation: bounceIn .5s cubic-bezier(.4,1.6,.6,1);
  }
  @keyframes bounceIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal .big { font-size: 64px; }
  .modal h2 { color: var(--white); font-size: 28px; margin: 6px 0; }
  .stars { font-size: 36px; letter-spacing: 4px; margin: 8px 0; color: var(--white); }
  .modal p { margin: 4px 0; }
  .modal p b { color: var(--white); }
  .modal .record { color: var(--white); font-weight: 600; }
  .modal .btn {
    margin-top: 16px; background: var(--white); color: var(--bg-1); border-color: var(--white);
    box-shadow: 0 4px 0 #8fa3d1;
  }

  .confetti {
    position: fixed; top: -40px; z-index: 40; pointer-events: none; font-size: 26px;
    animation: fall linear forwards; will-change: transform;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  .mute, .lite-btn { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 10; width: 48px; height: 48px; padding: 0; font-size: 22px; }
  .mute { right: calc(16px + env(safe-area-inset-right, 0px)); }
  .lite-btn { right: calc(72px + env(safe-area-inset-right, 0px)); }
  .lite-btn.on { background: var(--white); border-color: var(--white); }

  /* ---------- Lite mode: for low-end PCs / no dedicated GPU ---------- */
  body.lite .paw-bg span { animation: none; will-change: auto; }
  body.lite .face { box-shadow: 0 4px 0 rgba(0,0,0,.45); }
  body.lite .card.matched .front { box-shadow: 0 0 0 1px var(--white); }
  body.lite h1 { text-shadow: 0 3px 0 var(--blue-2); }
  body.lite .modal { box-shadow: none; }
  body.lite .card { transition-duration: .35s; }

  @media (prefers-reduced-motion: reduce) {
    .paw-bg span, .confetti { animation: none !important; }
    .confetti { display: none; }
  }
</style>
</head>
<body>
<div class="paw-bg" id="pawBg"></div>

<main>
  <h1>🐾 Paw Pairs 🐾</h1>
  <p class="subtitle">Flip the cards and find every matching animal friend!</p>

  <div class="levels">
    <button class="btn" data-level="easy">🐣 Easy</button>
    <button class="btn" data-level="medium">🐰 Medium</button>
    <button class="btn" data-level="hard">🦁 Hard</button>
  </div>

  <div class="stats">
    <div class="stat"><small>⏱️ Time</small><b id="time">0:00</b></div>
    <div class="stat"><small>👆 Moves</small><b id="moves">0</b></div>
    <div class="stat"><small>💙 Pairs</small><b id="pairs">0/0</b></div>
    <div class="stat"><small>🏆 Best</small><b id="best">-</b></div>
  </div>

  <div class="board" id="board"></div>

  <div class="controls">
    <button class="btn" id="restart">🔄 Restart</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="big" id="winEmoji">🎉</div>
    <h2>You did it!</h2>
    <div class="stars" id="stars"></div>
    <p>Time: <b id="winTime"></b></p>
    <p>Moves: <b id="winMoves"></b></p>
    <p class="record" id="record"></p>
    <button class="btn" id="playAgain">Play Again 🐾</button>
  </div>
</div>

<button class="btn lite-btn" id="lite" title="Lite mode (better performance)" aria-label="Toggle lite mode">⚡</button>
<button class="btn mute" id="mute" title="Sound on/off" aria-label="Toggle sound">🔊</button>

<script>
const ANIMALS = [
  ['🐶','Puppy'], ['🐱','Kitty'], ['🐰','Bunny'], ['🐼','Panda'],
  ['🐨','Koala'], ['🦊','Fox'], ['🐸','Froggy'], ['🐷','Piggy'],
  ['🐵','Monkey'], ['🐯','Tiger Cub'], ['🦁','Lion'], ['🐻','Bear'],
  ['🐹','Hamster'], ['🐮','Cow'], ['🐧','Penguin'], ['🐥','Chick'],
  ['🦄','Unicorn'], ['🐙','Octopus']
];
const LEVELS = {
  easy:   { pairs: 6,  cols: 4, size: 110 },
  medium: { pairs: 8,  cols: 4, size: 110 },
  hard:   { pairs: 12, cols: 6, size: 100 }
};
const CHEERS = [
  n => `Yay! You found the ${n}`,
  n => `Nice! ${n} pair`,
  n => `Awesome! ${n} matched`,
  n => `So cute! It's a ${n}`,
  n => `Great job! ${n} found`
];

const $ = id => document.getElementById(id);
const board = $('board');
// Safe storage: private mode / blocked site data must never break the game
const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
};
let level = store.get('animalMatchLevel');
if (!LEVELS[level]) level = 'easy';
let first = null, second = null, lock = false;
let moves = 0, matched = 0, totalPairs = 0;
let timer = null, seconds = 0, started = false;
let muted = store.get('animalMatchMuted') === '1';
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const weakDevice = (navigator.hardwareConcurrency || 8) <= 4 || (navigator.deviceMemory || 8) <= 4;
const savedLite = store.get('pawPairsLite');
let lite = savedLite === null ? (weakDevice || reducedMotion) : savedLite === '1';

// ---------- Sound (WebAudio, no files needed) ----------
let ctx;
const AudioCtx = window.AudioContext || window.webkitAudioContext;
function tone(freq, dur = .12, type = 'sine', delay = 0, vol = .15) {
  if (muted || !AudioCtx) return;           // browsers without Web Audio: play silently
  try {
    ctx = ctx || new AudioCtx();
    if (ctx.state === 'suspended') ctx.resume(); // iOS/Android start audio suspended
  } catch (e) { return; }
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  const t = ctx.currentTime + delay;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  flip:  () => tone(660, .08, 'triangle'),
  match: () => { tone(784, .12, 'sine'); tone(1046, .18, 'sine', .1); },
  wrong: () => { tone(300, .12, 'square', 0, .06); tone(240, .15, 'square', .1, .06); },
  win:   () => [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .25, 'sine', i * .12))
};

// ---------- Helpers ----------
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1200);
}

function bestKey() { return 'animalMatchBest_' + level; }
function loadBest() {
  let b = null;
  try { b = JSON.parse(store.get(bestKey()) || 'null'); } catch (e) {}
  $('best').textContent = b ? `${b.moves} moves` : '-';
  return b;
}

function updateStats() {
  $('moves').textContent = moves;
  $('pairs').textContent = `${matched}/${totalPairs}`;
  $('time').textContent = fmt(seconds);
}

// ---------- Game ----------
// Pending timeouts of the current round, cancelled on restart / level switch
let pending = [];
function later(fn, ms) { pending.push(setTimeout(fn, ms)); }

function layoutBoard() {
  const cfg = LEVELS[level];
  const cols = window.innerWidth < 520 && cfg.cols > 4 ? 4 : cfg.cols;
  board.style.gridTemplateColumns = `repeat(${cols}, minmax(0, ${cfg.size}px))`;
}

function newGame() {
  clearInterval(timer);
  pending.forEach(clearTimeout); pending = [];
  first = second = null; lock = false;
  moves = matched = seconds = 0; started = false;

  const cfg = LEVELS[level];
  totalPairs = cfg.pairs;
  document.querySelectorAll('.levels .btn').forEach(b => b.classList.toggle('active', b.dataset.level === level));

  const picks = shuffle([...ANIMALS]).slice(0, cfg.pairs);
  const deck = shuffle([...picks, ...picks]);

  layoutBoard();
  board.style.justifyContent = 'center';
  board.textContent = '';
  const frag = document.createDocumentFragment();

  deck.forEach(([emoji, name]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.emoji = emoji;
    card.dataset.name = name;
    card.innerHTML = `<div class="face back">🐾</div><div class="face front">${emoji}</div>`;
    frag.appendChild(card);
  });
  board.appendChild(frag);

  updateStats();
  loadBest();
}

function startTimer() {
  started = true;
  timer = setInterval(() => { seconds++; $('time').textContent = fmt(seconds); }, 1000);
}

function flip(card) {
  if (lock || card === first || card.classList.contains('matched')) return;
  if (!started) startTimer();

  card.classList.add('flipped');
  sfx.flip();

  if (!first) { first = card; return; }
  second = card;
  moves++;
  updateStats();
  check();
}

function check() {
  const isMatch = first.dataset.emoji === second.dataset.emoji;
  if (isMatch) {
    [first, second].forEach(c => { c.classList.remove('flipped'); c.classList.add('matched'); });
    matched++;
    sfx.match();
    showToast(`${CHEERS[Math.floor(Math.random() * CHEERS.length)](first.dataset.name)} ${first.dataset.emoji}`);
    first = second = null;
    updateStats();
    if (matched === totalPairs) later(win, 600);
  } else {
    lock = true;
    const a = first, b = second;
    later(() => {
      a.classList.add('wrong'); b.classList.add('wrong');
      sfx.wrong();
    }, 500);
    later(() => {
      a.classList.remove('flipped', 'wrong'); b.classList.remove('flipped', 'wrong');
      first = second = null; lock = false;
    }, 1000);
  }
}

function win() {
  clearInterval(timer);
  sfx.win();

  // stars based on moves relative to pairs
  const ratio = moves / totalPairs;
  const starCount = ratio <= 1.5 ? 3 : ratio <= 2.2 ? 2 : 1;
  $('stars').textContent = '⭐'.repeat(starCount) + '☆'.repeat(3 - starCount);
  $('winTime').textContent = fmt(seconds);
  $('winMoves').textContent = moves;
  $('winEmoji').textContent = ['🐶','🐱','🐰','🐼','🦄'][Math.floor(Math.random() * 5)] + '🎉';

  const best = loadBest();
  if (!best || moves < best.moves || (moves === best.moves && seconds < best.time)) {
    store.set(bestKey(), JSON.stringify({ moves, time: seconds }));
    $('record').textContent = '🏆 New record! Amazing!';
    loadBest();
  } else {
    $('record').textContent = `Best: ${best.moves} moves`;
  }

  $('overlay').classList.add('show');
  confetti();
}

function confetti() {
  const items = ['🐾','💙','⭐','❄️','🤍','✨'];
  if (reducedMotion) return;
  const count = lite ? 12 : 30;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = items[i % items.length];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    c.addEventListener('animationend', () => c.remove(), { once: true });
    frag.appendChild(c);
  }
  document.body.appendChild(frag);
}

// ---------- Background paws ----------
(function () {
  const bg = $('pawBg');
  const icons = ['🐾','🦴','🐟','🥕','🌸'];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span');
    s.textContent = icons[i % icons.length];
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = -Math.random() * 9 + 's';
    bg.appendChild(s);
  }
})();

// ---------- Events ----------
// Re-layout (without restarting) when a phone/tablet is rotated or the window resized
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutBoard, 120); });

// One delegated listener for all cards (instead of one per card)
board.addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) flip(card);
});

// Lite mode: auto-on for weak hardware (≤4 CPU threads or ≤4 GB RAM), user can toggle
function applyLite() {
  document.body.classList.toggle('lite', lite);
  $('lite').classList.toggle('on', lite);
  $('lite').title = lite ? 'Lite mode: ON (click for full effects)' : 'Lite mode: OFF (click for better performance)';
}
$('lite').addEventListener('click', () => {
  lite = !lite;
  store.set('pawPairsLite', lite ? '1' : '0');
  applyLite();
});
applyLite();

document.querySelectorAll('.levels .btn').forEach(b => b.addEventListener('click', () => {
  level = b.dataset.level;
  store.set('animalMatchLevel', level);
  newGame();
}));
$('restart').addEventListener('click', newGame);
$('playAgain').addEventListener('click', () => { $('overlay').classList.remove('show'); newGame(); });
$('mute').textContent = muted ? '🔇' : '🔊';
$('mute').addEventListener('click', () => {
  muted = !muted;
  store.set('animalMatchMuted', muted ? '1' : '0');
  $('mute').textContent = muted ? '🔇' : '🔊';
});

newGame();
</script>
</body>
</html>
